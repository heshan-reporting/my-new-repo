<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my-new-repo</title>
<style>
  :root {
    --bg: #fbfaf8;
    --panel: #ffffff;
    --text: #1b1a18;
    --muted: #61605c;
    --line: #e4e1db;
    --accent: #c2552d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171614;
      --panel: #201f1c;
      --text: #f2f0ec;
      --muted: #a3a09a;
      --line: #34322e;
      --accent: #e0784d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem 1.25rem;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main {
    width: 100%;
    max-width: 34rem;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 2.25rem;
  }
  .badge {
    display: inline-block;
    font-size: .75rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: .2rem .7rem;
    margin-bottom: 1.1rem;
  }
  h1 { margin: 0 0 .5rem; font-size: 1.9rem; line-height: 1.2; }
  p { margin: 0 0 1rem; color: var(--muted); }
  hr { border: 0; border-top: 1px solid var(--line); margin: 1.5rem 0; }
  a { color: var(--accent); }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .875em;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: .1rem .35rem;
  }
  footer { font-size: .85rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <span class="badge">Live</span>
  <h1>my-new-repo</h1>
  <p>If you are reading this in a browser, GitHub Pages is enabled and serving
     this repository correctly.</p>
  <hr>
  <p>This page is served from <code>index.html</code> on the <code>main</code>
     branch. Edit that file and push, and the site rebuilds within about a
     minute.</p>
  <footer>heshan-reporting/my-new-repo</footer>
</main>
</body>
</html>
